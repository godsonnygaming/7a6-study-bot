services:
  - type: web
    name: 7a6-study-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
